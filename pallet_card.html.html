<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pallet Card — Alestesharia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --green-deep:   #1B5E20;
  --green-main:   #2E7D32;
  --green-accent: #43A047;
  --green-pale:   #E8F5E9;
  --green-light:  #C8E6C9;
  --gold:         #C9A227;
  --gold-warm:    #E8C547;
  --white:        #FFFFFF;
  --off-white:    #F6FAF6;
  --text-dark:    #182818;
  --text-mid:     #4a6a4a;
  --text-light:   #8aaa8a;
  --border:       #D6EAD6;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Barlow', sans-serif;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(67,160,71,0.18) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 100%, rgba(27,94,32,0.25) 0%, transparent 55%),
    linear-gradient(160deg, #0a2e0d 0%, #1B5E20 60%, #145218 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 14px;
}

/* subtle grid overlay */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

/* ── CARD ── */
.card {
  background: var(--white);
  border-radius: 18px;
  width: 100%; max-width: 460px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.07),
    0 4px 24px rgba(0,0,0,0.2),
    0 20px 60px rgba(0,0,0,0.3);
  overflow: hidden;
  animation: rise 0.5s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes rise {
  from { opacity:0; transform: translateY(20px) scale(0.98); }
  to   { opacity:1; transform: none; }
}

/* ── HEADER ── */
.header {
  background: linear-gradient(150deg, #1a3e1c 0%, var(--green-main) 100%);
  padding: 0;
  position: relative;
  overflow: hidden;
}

/* large decorative circle */
.header::after {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 220px; height: 220px;
  border-radius: 50%;
  background: rgba(255,255,255,0.04);
  pointer-events: none;
}

.header-top {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px 22px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

/* LOGO AREA — large & clear */
.logo-mark {
  flex-shrink: 0;
  width: 64px; height: 64px;
  background: rgba(255,255,255,0.10);
  border: 2px solid rgba(255,255,255,0.18);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}
.logo-leaf { font-size: 28px; line-height: 1; }
.logo-dot  {
  display: flex; gap: 3px;
}
.logo-dot span {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--gold);
}

.company-info { flex: 1; }
.company-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 17px;
  color: var(--white);
  letter-spacing: 0.5px;
  line-height: 1.1;
}
.company-sub {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  font-weight: 400;
  margin-top: 3px;
  letter-spacing: 0.2px;
}
.dept-badge {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px;
  padding: 3px 10px;
  font-size: 9.5px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  color: var(--gold-warm);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  white-space: nowrap;
  align-self: flex-start;
  margin-top: 2px;
}

.header-bottom {
  padding: 14px 22px 18px;
}
.page-label {
  font-size: 10px;
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--green-light);
  font-weight: 600;
  margin-bottom: 4px;
}
.page-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 26px;
  color: var(--white);
  line-height: 1;
  margin-bottom: 10px;
}
.batch-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: rgba(255,255,255,0.10);
  border: 1.5px solid rgba(255,255,255,0.18);
  border-radius: 30px;
  padding: 5px 16px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--gold-warm);
  letter-spacing: 1px;
}
.batch-pill::before {
  content: '';
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--gold);
  display: inline-block;
}

/* ── GOLD LINE ── */
.gold-line {
  height: 3px;
  background: linear-gradient(90deg, transparent 0%, var(--gold) 30%, var(--gold-warm) 60%, transparent 100%);
}

/* ── QC STAMP ── */
.stamp-band {
  background: linear-gradient(90deg, #edf7ee 0%, #f2faf2 100%);
  padding: 16px 22px;
  display: flex;
  align-items: center;
  gap: 18px;
  border-bottom: 1px solid var(--border);
}
.stamp-ring {
  width: 68px; height: 68px; flex-shrink: 0;
  border: 4px solid var(--green-main);
  border-radius: 50%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transform: rotate(-7deg);
  background: white;
  box-shadow: 0 3px 14px rgba(46,125,50,0.18);
  animation: stampIn 0.4s 0.3s ease both;
}
@keyframes stampIn {
  from { opacity:0; transform: rotate(-7deg) scale(0.5); }
  to   { opacity:1; transform: rotate(-7deg) scale(1); }
}
.stamp-check { font-size: 26px; color: var(--green-main); line-height: 1; }
.stamp-word  { font-size: 7px; font-weight: 800; color: var(--green-main); letter-spacing: 1.2px; margin-top: 1px; font-family: 'Barlow Condensed', sans-serif; }
.stamp-info { flex: 1; }
.stamp-main {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px; font-weight: 800;
  color: var(--green-deep);
  letter-spacing: 0.3px;
}
.stamp-sub {
  font-size: 11.5px;
  color: var(--text-mid);
  margin-top: 2px;
  font-weight: 500;
}

/* ── FIELDS ── */
.fields { padding: 18px 22px 14px; }

.section-head {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--green-main);
  padding: 10px 0 5px;
  border-bottom: 1.5px solid var(--green-light);
  margin-bottom: 1px;
}

.frow {
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--border);
  min-height: 44px;
  transition: background 0.15s;
}
.frow:last-child { border-bottom: none; }
.frow:hover { background: var(--off-white); border-radius: 6px; }
.frow.accent {
  background: var(--green-pale);
  border-radius: 8px;
  border: none;
  margin: 4px 0;
  padding: 2px 8px;
}
.frow.accent:hover { background: #dcedc8; }

.flabel {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-mid);
  min-width: 126px;
  flex-shrink: 0;
  padding: 8px 10px 8px 0;
  line-height: 1.3;
}
.flabel .sub {
  display: block;
  font-size: 9.5px;
  color: var(--text-light);
  font-weight: 400;
}
.fval {
  flex: 1;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-dark);
  padding: 8px 0;
  word-break: break-word;
}
.fval.big {
  font-size: 17px;
  color: var(--green-deep);
}
.fval.mono {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  letter-spacing: 0.3px;
  color: var(--green-main);
}

/* ── FOOTER ── */
.footer {
  background: linear-gradient(90deg, #152e17 0%, var(--green-deep) 100%);
  padding: 13px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.footer-left {
  font-family: 'Barlow Condensed', sans-serif;
}
.footer-line1 {
  font-size: 12px;
  font-weight: 700;
  color: var(--green-light);
  letter-spacing: 0.5px;
}
.footer-line2 {
  font-size: 10px;
  color: rgba(255,255,255,0.38);
  margin-top: 1px;
  letter-spacing: 0.3px;
}
.certified-badge {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.5px;
  background: var(--gold);
  color: var(--green-deep);
  padding: 5px 14px;
  border-radius: 20px;
}

/* ── NO DATA ── */
.no-data {
  padding: 50px 24px;
  text-align: center;
}
.no-data h2 { font-size: 16px; color: #c00; margin-bottom: 8px; }
.no-data p  { font-size: 12px; color: #888; }

@media print {
  body { background: white; padding: 0; }
  .card { box-shadow: none; border-radius: 0; max-width: 100%; animation: none; }
  .stamp-ring { animation: none; }
}
@media (max-width: 420px) {
  .company-name { font-size: 14px; }
  .page-title { font-size: 22px; }
  .flabel { min-width: 108px; }
}
</style>
</head>
<body>
<div class="card">

  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <div class="logo-mark">
        <div class="logo-leaf">🌿</div>
        <div class="logo-dot"><span></span><span></span><span></span></div>
      </div>
      <div class="company-info">
        <div class="company-name">Alestesharia Animal Nutrition</div>
        <div class="company-sub">Feed Additives Consulting Company · Jordan</div>
      </div>
      <div class="dept-badge">QC Dept</div>
    </div>
    <div class="header-bottom">
      <div class="page-label">Official Document</div>
      <div class="page-title">Pallet Card</div>
      <div class="batch-pill" id="batchPill">Loading…</div>
    </div>
  </div>

  <div class="gold-line"></div>

  <!-- QC STAMP -->
  <div class="stamp-band">
    <div class="stamp-ring">
      <div class="stamp-check">✔</div>
      <div class="stamp-word">QC PASSED</div>
    </div>
    <div class="stamp-info">
      <div class="stamp-main">🟢 QC PASSED</div>
      <div class="stamp-sub">Quality Control — Approved &amp; Released</div>
    </div>
  </div>

  <!-- FIELDS -->
  <div class="fields" id="fields">
    <div class="no-data">
      <h2>⚠ No data found</h2>
      <p>Make sure the QR link contains all required parameters.</p>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="footer-left">
      <div class="footer-line1">QC Department · Alestesharia</div>
      <div class="footer-line2" id="footerDate"></div>
    </div>
    <div class="certified-badge">CERTIFIED</div>
  </div>

</div>

<script>
const p  = new URLSearchParams(window.location.search);
const b  = p.get('b')  || '';
const cu = p.get('cu') || '';   // customer
const pr = p.get('pr') || '';   // product name
const lc = p.get('lc') || '';   // label code
const d  = p.get('d')  || '';
const w  = p.get('w')  || '';
const n  = p.get('n')  || '';
const bw = p.get('bw') || '';

if (!b) {
  document.getElementById('batchPill').textContent = 'No Data';
} else {
  document.getElementById('batchPill').textContent = 'Batch No. ' + b;
  document.getElementById('footerDate').textContent = 'Production Date: ' + d;

  const sections = [
    {
      head: 'Product Information',
      rows: [
        { label: 'Product Name',    sub: '',              val: pr,         accent: true, big: true },
        { label: 'Customer',        sub: '',              val: cu,         accent: false },
        { label: 'Label Code',      sub: '',              val: lc,         mono: true },
        { label: 'Production Date', sub: '',              val: d,          accent: false },
      ]
    },
    {
      head: 'Pallet Details',
      rows: [
        { label: 'Total Pallet Weight', sub: '', val: w  + ' kg',   accent: true, big: true },
        { label: 'Number of Bags',      sub: '', val: n  + ' bags', accent: false },
        { label: 'Bag Weight',          sub: '', val: bw + ' kg',   accent: false },
      ]
    },
    {
      head: 'Batch Reference',
      rows: [
        { label: 'Batch No.', sub: '', val: b, mono: true },
      ]
    },
  ];

  let html = '';
  sections.forEach(sec => {
    html += `<div class="section-head">${sec.head}</div>`;
    sec.rows.forEach(r => {
      const vc = ['fval', r.big ? 'big' : '', r.mono ? 'mono' : ''].filter(Boolean).join(' ');
      const rc = 'frow' + (r.accent ? ' accent' : '');
      html += `<div class="${rc}">
        <div class="flabel">${r.label}${r.sub ? `<span class="sub">${r.sub}</span>` : ''}</div>
        <div class="${vc}">${r.val || '—'}</div>
      </div>`;
    });
  });

  document.getElementById('fields').innerHTML = html;
}
</script>
</body>
</html>
