body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f0f2f5;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 24px 16px 48px;
}

.card {
  background: #fff;
  border-radius: 20px;
  width: 100%;
  max-width: 420px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.10);
}

/* ── HEADER ── */
.header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid #eee;
}
.company-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}
.logo {
  width: 44px; height: 44px;
  background: #e8f5e9;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.company-name {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: #5a8a5a;
}
.product-name {
  font-size: 22px;
  font-weight: 700;
  color: #1a1a1a;
  line-height: 1.2;
}
.batch-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #f5f5f5;
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 13px;
  color: #444;
  margin-top: 10px;
}
.batch-pill .sep { color: #bbb; }

/* ── STATUS BAR ── */
.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 20px;
  border-bottom: 1px solid #eee;
}
.status-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #999;
}
.status-badge {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 4px 14px;
  border-radius: 20px;
  border: 1.5px solid #ccc;
  color: #666;
  background: #fff;
}
.status-badge.released {
  background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7;
}
.status-badge.hold {
  background: #fff3e0; color: #e65100; border-color: #ffcc80;
}
.status-badge.fail {
  background: #ffebee; color: #c62828; border-color: #ef9a9a;
}

/* ── SECTION TITLE ── */
.section-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: #aaa;
  padding: 14px 20px 6px;
}

/* ── QC MEASUREMENTS ── */
.qc-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 16px 4px;
}
.qc-card {
  border-radius: 14px;
  padding: 14px;
}
.qc-card.density { background: #fff0f0; }
.qc-card.moisture { background: #f0fff4; }
.qc-icon { font-size: 18px; margin-bottom: 4px; }
.qc-value {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.qc-card.density .qc-value { color: #c62828; }
.qc-card.moisture .qc-value { color: #2e7d32; }
.qc-unit {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: #888;
  margin-top: 2px;
}
.qc-ref {
  font-size: 11px;
  color: #888;
  margin-top: 4px;
}
.qc-ref strong { color: #555; }

/* ── BATCH DETAILS ── */
.details-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 16px 4px;
}
.detail-card {
  background: #f9f9f9;
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.detail-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
.detail-label {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: #aaa;
  margin-bottom: 3px;
}
.detail-value {
  font-size: 14px;
  font-weight: 700;
  color: #222;
  word-break: break-word;
}
.detail-value.empty { color: #ccc; font-weight: 400; font-size: 18px; }

/* ── NOTES ── */
.notes-box {
  margin: 0 16px 4px;
  background: #fffbea;
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.notes-icon { font-size: 18px; flex-shrink: 0; }
.notes-label {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: #aaa;
  margin-bottom: 4px;
}
.notes-text {
  font-size: 13px;
  color: #555;
  line-height: 1.5;
  white-space: pre-wrap;
}

/* ── DATE ── */
.date-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 12px 20px 4px;
  font-size: 13px;
  color: #888;
}

/* ── ACTIONS ── */
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 14px 16px 20px;
}
.btn {
  border: none;
  border-radius: 12px;
  padding: 13px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: opacity 0.15s;
}
.btn:active { opacity: 0.75; }
.btn-primary { background: #2d5a2d; color: #fff; }
.btn-secondary { background: #f0f0f0; color: #333; }

<body>
<div class="card" id="card">

  <!-- HEADER -->

  <div class="header">
    <div class="company-row">
      <div class="logo">🌿</div>
      <div>
        <div class="company-name" id="company">—</div>
        <div class="product-name" id="product">—</div>
      </div>
    </div>
    <div class="batch-pill">
      <span>📦</span>
      <span id="batch">—</span>
      <span class="sep">·</span>
      <span id="date">—</span>
    </div>
  </div>

  <!-- STATUS -->

  <div class="status-bar">
    <span class="status-label">QC STATUS</span>
    <span class="status-badge" id="status-badge">UNKNOWN</span>
  </div>

  <!-- QC MEASUREMENTS -->

  <div class="section-title">QC MEASUREMENTS</div>
  <div class="qc-grid">
    <div class="qc-card density">
      <div class="qc-icon">🧪</div>
      <div class="qc-value" id="density">—</div>
      <div class="qc-unit">DENSITY (G/ML)</div>
      <div class="qc-ref">REF: <strong id="ref-density">—</strong></div>
    </div>
    <div class="qc-card moisture">
      <div class="qc-icon">💧</div>
      <div class="qc-value" id="moisture">—</div>
      <div class="qc-unit">MOISTURE</div>
      <div class="qc-ref">REF: <strong id="ref-moisture">—</strong></div>
    </div>
  </div>

  <!-- BATCH DETAILS -->

  <div class="section-title">BATCH DETAILS</div>
  <div class="details-grid">
    <div class="detail-card">
      <div class="detail-icon">⚖️</div>
      <div>
        <div class="detail-label">PRODUCED QTY</div>
        <div class="detail-value" id="produced-qty"><span class="empty">—</span></div>
      </div>
    </div>
    <div class="detail-card">
      <div class="detail-icon">🛍️</div>
      <div>
        <div class="detail-label">BAG WEIGHT</div>
        <div class="detail-value" id="bag-weight"><span class="empty">—</span></div>
      </div>
    </div>
    <div class="detail-card">
      <div class="detail-icon">🏢</div>
      <div>
        <div class="detail-label">CUSTOMER</div>
        <div class="detail-value" id="customer">—</div>
      </div>
    </div>
    <div class="detail-card">
      <div class="detail-icon">🏷️</div>
      <div>
        <div class="detail-label">PRODUCT CODE</div>
        <div class="detail-value" id="prod-code">—</div>
      </div>
    </div>
  </div>

  <!-- NOTES (shown only if present) -->

  <div id="notes-section" style="display:none;">
    <div class="section-title">NOTES</div>
    <div class="notes-box">
      <div class="notes-icon">📝</div>
      <div>
        <div class="notes-label">QC NOTE</div>
        <div class="notes-text" id="notes-text"></div>
      </div>
    </div>
  </div>

  <!-- DATE -->

  <div class="date-row">
    <span>📅</span>
    <span id="date-display">—</span>
  </div>

  <!-- ACTIONS -->

  <div class="actions">
    <button class="btn btn-primary" onclick="window.print()">🖨️ Print / PDF</button>
    <button class="btn btn-secondary" onclick="copyLink()">🔗 Copy Link</button>
  </div>
</div>

<script>
  function getParams() {
    const p = new URLSearchParams(window.location.search);
    return {
      batch:      p.get('b')  || '',
      product:    p.get('p')  || '',
      density:    p.get('d')  || '',
      moisture:   p.get('m')  || '',
      status:     p.get('s')  || '',
      date:       p.get('dt') || '',
      customer:   p.get('c')  || '',
      company:    p.get('co') || 'Alestsharia Animal Nutrition',
      prodCode:   p.get('pc') || '',
      refDensity: p.get('rd') || '',
      refMoisture:p.get('rm') || '',
      producedQty:p.get('pq') || '',   // NEW: Produced Qty (tons)
      bagWeight:  p.get('bw') || '',   // NEW: Bag Weight (kg)
      notes:      p.get('nt') || '',   // NEW: Notes from col T
    };
  }

  function formatDate(str) {
    if (!str) return '—';
    try {
      const d = new Date(str);
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    } catch { return str; }
  }

  function setText(id, val, fallback = '—') {
    document.getElementById(id).textContent = val || fallback;
  }

  function render() {
    const q = getParams();

    // Header
    document.getElementById('company').textContent = q.company.toUpperCase();
    document.getElementById('product').textContent = q.product || '—';
    document.getElementById('batch').textContent   = q.batch   || '—';

    // Date
    const dateFormatted = formatDate(q.date);
    document.getElementById('date').textContent         = dateFormatted;
    document.getElementById('date-display').textContent = dateFormatted;

    // Page title
    if (q.product) document.title = q.product + ' · ' + q.batch;

    // Status badge
    const badge = document.getElementById('status-badge');
    const s = q.status.toUpperCase();
    badge.textContent = s || 'UNKNOWN';
    if (s === 'RELEASED') badge.classList.add('released');
    else if (s === 'HOLD') badge.classList.add('hold');
    else if (s === 'FAIL') badge.classList.add('fail');

    // QC measurements
    document.getElementById('density').textContent  = q.density  ? q.density  + ' g/mL' : '0.000';
    document.getElementById('moisture').textContent = q.moisture ? q.moisture + '%'      : '0.00%';
    document.getElementById('ref-density').textContent  = q.refDensity  ? q.refDensity  + ' g/mL' : '—';
    document.getElementById('ref-moisture').textContent = q.refMoisture ? q.refMoisture + '%'      : '—';

    // Batch details
    // Produced qty: stored as tons → display as tons
    const pqEl = document.getElementById('produced-qty');
    if (q.producedQty) {
      pqEl.innerHTML = '';
      pqEl.textContent = parseFloat(q.producedQty).toFixed(3) + ' ton';
    }

    // Bag weight in kg
    const bwEl = document.getElementById('bag-weight');
    if (q.bagWeight) {
      bwEl.innerHTML = '';
      bwEl.textContent = parseFloat(q.bagWeight).toFixed(1) + ' kg';
    }

    document.getElementById('customer').textContent  = q.customer  || '—';
    document.getElementById('prod-code').textContent = q.prodCode  || '—';

    // Notes
    if (q.notes && q.notes.trim() !== '') {
      document.getElementById('notes-section').style.display = 'block';
      document.getElementById('notes-text').textContent = q.notes.trim();
    }
  }

  function copyLink() {
    navigator.clipboard.writeText(window.location.href)
      .then(() => alert('Link copied!'))
      .catch(() => alert('Could not copy link.'));
  }

  render();
</script>

</body>
</html>
